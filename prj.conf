CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_EVENTS=y
CONFIG_PM_DEVICE=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y

CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_OWN_THREAD=y

CONFIG_SHB_BMI_ANYMOTION_WAKE=y
CONFIG_SHB_SENSOR_POLL_INTERVAL_MS=1000

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_CRC=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=40

# MAX32664D BPT calibration can remain at 0% for a long time when the
# optical placement is marginal. Do not abort the MAX32664 session after
# 90 s; keep the calibration loop alive so it can complete when the finger
# placement becomes stable enough.
CONFIG_SHB_MAX32664_CAL_TIMEOUT_S=0

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SmartHealth Band"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
CONFIG_BT_L2CAP_TX_MTU=64
CONFIG_BT_BUF_ACL_TX_SIZE=100
CONFIG_BT_BUF_ACL_RX_SIZE=100
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_ATT_PREPARE_COUNT=0
